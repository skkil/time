version: 1
name: time

requires:
  - name: Node.js
    check: command -v node
    hint: install Node.js 22 or later
  - name: pnpm
    check: command -v pnpm
    hint: npm install -g pnpm
  - name: Rust
    check: command -v cargo
    hint: curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh
  - name: Java 25
    check: java -version 2>&1 | grep -q 'version "2[5-9]'
    hint: install a JDK 25 (for example with sdkman)
  - name: Docker
    check: command -v docker
    hint: install Docker for the local database and the server tests
  - name: workspace dependencies
    check: test -d node_modules
    hint: pnpm install
  - name: store checkout at STORE_VERSION
    check: test "$(git -C "${STORE_DIR:-../store}" describe --tags --exact-match 2>/dev/null)" = "$(cat STORE_VERSION)"
    hint: git -C ../store fetch --tags && git -C ../store checkout "$(cat STORE_VERSION)" (first time, clone the store repo with --branch "$(cat STORE_VERSION)" into ../store, or set STORE_DIR)
  - name: wasm-bindgen-cli
    check: wasm-bindgen --version | grep -q "$(sed -n 's/^wasm-bindgen = "=\(.*\)"$/\1/p' apps/web/engine/Cargo.toml)"
    hint: cargo install wasm-bindgen-cli --locked --version <the wasm-bindgen pin in apps/web/engine/Cargo.toml>, and rustup target add wasm32-unknown-unknown
  - name: store client build
    check: test -f "${STORE_DIR:-../store}/modules/client-ts/dist/index.js"
    hint: (cd "${STORE_DIR:-../store}/modules/client-ts" && pnpm install --frozen-lockfile && pnpm build); apps/web and apps/mobile link it by path
  - name: Go
    check: command -v go
    hint: install Go 1.27 or later (builds store's conformance suite)
  - name: cargo-ndk
    check: command -v cargo-ndk
    hint: cargo install cargo-ndk && rustup target add aarch64-linux-android x86_64-linux-android aarch64-apple-ios aarch64-apple-ios-sim
  - name: Android NDK 30
    check: test -d "${ANDROID_NDK_HOME:-${ANDROID_HOME:-$HOME/Android/Sdk}/ndk/30.0.14904198}"
    hint: sdkmanager "ndk;30.0.14904198" (or set ANDROID_NDK_HOME); builds apps/mobile/native for Android

dev:
  run:
    - name: services
      run: docker compose up --build
      dir: infra
    - name: server
      run: ./gradlew bootRun
      dir: apps/server
    - name: web
      run: pnpm dev
      dir: apps/web
    - name: desktop
      run: pnpm tauri dev
      dir: apps/desktop

assets:
  - name: app-icon
    source: assets/icon.svg
    outputs:
      - format: png
        size:
          - 32
        inset: 80
        dest: apps/desktop/src-tauri/icons/32x32.png
      - format: png
        size:
          - 128
        dest: apps/desktop/src-tauri/icons/128x128.png
      - format: png
        size:
          - 256
        dest: apps/desktop/src-tauri/icons/128x128@2x.png
      - format: png
        size:
          - 512
        dest: apps/desktop/src-tauri/icons/icon.png
      - format: png
        size:
          - 30
        inset: 80
        dest: apps/desktop/src-tauri/icons/Square30x30Logo.png
      - format: png
        size:
          - 44
        inset: 80
        dest: apps/desktop/src-tauri/icons/Square44x44Logo.png
      - format: png
        size:
          - 71
        dest: apps/desktop/src-tauri/icons/Square71x71Logo.png
      - format: png
        size:
          - 89
        dest: apps/desktop/src-tauri/icons/Square89x89Logo.png
      - format: png
        size:
          - 107
        dest: apps/desktop/src-tauri/icons/Square107x107Logo.png
      - format: png
        size:
          - 142
        dest: apps/desktop/src-tauri/icons/Square142x142Logo.png
      - format: png
        size:
          - 150
        dest: apps/desktop/src-tauri/icons/Square150x150Logo.png
      - format: png
        size:
          - 284
        dest: apps/desktop/src-tauri/icons/Square284x284Logo.png
      - format: png
        size:
          - 310
        dest: apps/desktop/src-tauri/icons/Square310x310Logo.png
      - format: png
        size:
          - 50
        inset: 80
        dest: apps/desktop/src-tauri/icons/StoreLogo.png
      - format: ico
        size:
          - 16
          - 24
          - 32
          - 48
          - 64
          - 256
        inset: 80
        dest: apps/desktop/src-tauri/icons/icon.ico
      - format: copy
        dest: apps/desktop/public/favicon.svg
      - format: copy
        dest: apps/web/public/favicon.svg
      - format: png
        size:
          - 1024
        dest: apps/mobile/assets/icon.png
      - format: png
        size:
          - 512
        dest: apps/mobile/assets/splash-icon.png
      - format: png
        size:
          - 48
        dest: apps/mobile/assets/favicon.png

ci:
  tasks:
    - name: time-core
      dir: apps/shared/core
      format: cargo fmt --check
      lint: cargo clippy --all-targets --features specta -- -D warnings
      test: cargo test
      build: cargo build --target wasm32-unknown-unknown --no-default-features
    - name: web-engine
      dir: apps/web/engine
      format: cargo fmt --check
      lint: cargo clippy --all-targets -- -D warnings
      test: cargo test
      build: sh scripts/build.sh
      depends_on:
        - time-core
    - name: desktop-tauri
      dir: apps/desktop/src-tauri
      format: cargo fmt --check
      lint: cargo clippy --all-targets -- -D warnings
      test: cargo test && git diff --exit-code -- ../../shared/contract/src/bindings.ts
      depends_on:
        - time-core
    - name: shared-rules
      dir: apps/shared/rules
      format: pnpm format:check
      lint: pnpm lint
      test: pnpm test
      build: pnpm compile
    - name: shared-tokens
      dir: apps/shared/tokens
      format: pnpm format:check
      lint: pnpm lint
      test: pnpm test
      build: pnpm compile
    - name: shared-app
      dir: apps/shared/app
      format: pnpm format:check
      lint: pnpm lint
      test: pnpm test
      build: pnpm compile
    - name: shared-api
      dir: apps/shared/api
      format: pnpm format:check
      lint: pnpm lint
      test: pnpm check:generated
      build: pnpm compile
      depends_on:
        - server
    - name: shared-remote
      dir: apps/shared/remote
      format: pnpm format:check
      lint: pnpm lint
      build: pnpm compile
      depends_on:
        - desktop-tauri
        - shared-api
    - name: shared-local
      dir: apps/shared/local
      format: pnpm format:check
      lint: pnpm check:generated && pnpm lint
      test: pnpm test
      build: pnpm compile
      depends_on:
        - desktop-tauri
    - name: shared-contract
      dir: apps/shared/contract
      format: pnpm format:check
    - name: shared-sync
      dir: apps/shared/sync
      format: pnpm format:check
      lint: pnpm lint
      test: pnpm test
      build: pnpm compile
    - name: shared-auth
      dir: apps/shared/auth
      format: pnpm format:check
      lint: pnpm lint
      build: pnpm compile
    - name: server
      dir: apps/server
      format: ./gradlew spotlessCheck
      test: ./gradlew test
      build: ./gradlew bootJar
    - name: store-conformance
      dir: apps/server
      test: ./conformance/run.sh -runs 3
      depends_on:
        - server
    - name: web
      dir: apps/web
      format: pnpm format:check
      lint: pnpm lint
      test: pnpm test
      build: pnpm build
      depends_on:
        - web-engine
    - name: mobile-native
      dir: apps/mobile/native
      format: cargo fmt --check && pnpm format:check
      lint: cargo clippy --all-targets -- -D warnings && pnpm lint
      test: cargo test && pnpm test && pnpm check:ios
      build: pnpm check:generated && pnpm compile
      depends_on:
        - time-core
    - name: mobile
      dir: apps/mobile
      format: pnpm format:check
      lint: pnpm lint
      test: pnpm test
      build: pnpm compile && npx expo-doctor && npx expo export --platform android --platform ios --output-dir dist
      depends_on:
        - mobile-native
        - shared-local
    - name: mobile-android
      dir: apps/mobile
      build: npx expo prebuild --platform android --no-install --clean && (cd android && ./gradlew assembleDebug)
      depends_on:
        - mobile
    - name: desktop
      dir: apps/desktop
      format: pnpm format:check
      lint: pnpm lint
      build: pnpm tauri build
      depends_on:
        - desktop-tauri

devices:
  - os: android
    dir: apps/mobile
    run: ./scripts/run-android.sh
