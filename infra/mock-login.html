<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Sign in (mock)</title>
    <style>
      body {
        font: 15px/1.5 system-ui, sans-serif;
        max-width: 22rem;
        margin: 4rem auto;
        padding: 0 1rem;
        color: #1c2433;
      }
      label {
        display: grid;
        gap: 0.25rem;
        margin-bottom: 0.75rem;
        font-size: 13px;
        color: #556;
      }
      input {
        font: inherit;
        padding: 0.4rem 0.6rem;
        border: 1px solid #ccd;
        border-radius: 6px;
      }
      button {
        font: inherit;
        padding: 0.45rem 1rem;
        border: 0;
        border-radius: 6px;
        background: #2a4d8f;
        color: white;
      }
      p {
        font-size: 13px;
        color: #778;
      }
    </style>
  </head>
  <body>
    <h1>Mock sign-in</h1>
    <p>
      Development only. The user name becomes the subject; name and email go
      into the ID and access tokens.
    </p>
    <form method="post" id="login">
      <label>
        User
        <input name="username" required autofocus placeholder="ada" />
      </label>
      <label>
        Name
        <input id="name" placeholder="Same as the user" />
      </label>
      <label>
        Email
        <input id="email" type="email" placeholder="user@example.com" />
      </label>
      <input type="hidden" name="claims" id="claims" />
      <button type="submit">Sign in</button>
    </form>
    <script>
      document.getElementById('login').addEventListener('submit', () => {
        const user = document.querySelector('[name=username]').value.trim();
        const name = document.getElementById('name').value.trim() || user;
        const email =
          document.getElementById('email').value.trim() ||
          `${user}@example.com`;
        document.getElementById('claims').value = JSON.stringify({
          name,
          email,
        });
      });
    </script>
  </body>
</html>
