name: skkil-time

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: time
      POSTGRES_USER: time
      POSTGRES_PASSWORD: time
    ports:
      - "5433:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U time -d time"]
      interval: 5s
      retries: 10

  auth:
    image: ghcr.io/navikt/mock-oauth2-server:3.0.1
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090
      JSON_CONFIG: >-
        {"interactiveLogin": true, "tokenCallbacks": [{"issuerId": "default", "tokenExpiry": 3600,
        "requestMappings": [{"requestParam": "client_id", "match": "*", "claims": {"aud": ["time-api"]}}]}]}

volumes:
  postgres:
