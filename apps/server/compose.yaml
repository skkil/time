name: skkil-time

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: time
      POSTGRES_USER: time
      POSTGRES_PASSWORD: time
    ports:
      - "5433:5432"
    volumes:
      - postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U time -d time"]
      interval: 5s
      retries: 10

  auth:
    image: ghcr.io/navikt/mock-oauth2-server:3.0.1
    ports:
      - "8090:8090"
    environment:
      SERVER_PORT: 8090
      JSON_CONFIG: >-
        {"interactiveLogin": true, "tokenCallbacks": [{"issuerId": "default", "tokenExpiry": 3600,
        "requestMappings": [{"requestParam": "client_id", "match": "*", "claims": {"aud": ["time-api"]}}]}]}

  store:
    build: ${STORE_DIR:-../../../store}/modules/service
    ports:
      - "8091:8080"
    environment:
      STORE_DATABASE_URL: postgres://time:time@postgres:5432/time
      STORE_TOKEN_ISSUER: time
      STORE_TOKEN_JWKS_URL: http://host.docker.internal:8080/api/v1/sync/jwks.json
      STORE_ALLOWED_ORIGINS: http://localhost:5173
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

volumes:
  postgres:
