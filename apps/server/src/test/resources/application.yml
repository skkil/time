spring:
  profiles:
    active: dev
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: https://issuer.test/
          audiences: time-api
management:
  server:
    port: 0
time:
  rate-limit:
    requests-per-minute: 100000
  push:
    reminders: false
  sync:
    baseline-on-start: false
  calendar:
    provider: fake
    sync: false
