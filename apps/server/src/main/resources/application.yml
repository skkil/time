spring:
  application:
    name: time-server
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5433/time}
    username: ${DATABASE_USERNAME:time}
    password: ${DATABASE_PASSWORD:time}
    hikari:
      maximum-pool-size: ${DATABASE_POOL_SIZE:10}
  flyway:
    enabled: true
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${AUTH_ISSUER_URI:http://localhost:8090/default}
          audiences: ${AUTH_AUDIENCE:time-api}
  lifecycle:
    timeout-per-shutdown-phase: 20s

server:
  port: ${PORT:8080}
  shutdown: graceful
  forward-headers-strategy: framework
  error:
    include-stacktrace: never

management:
  server:
    port: ${MANAGEMENT_PORT:8081}
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
        add-additional-paths: true
  info:
    env:
      enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  default-produces-media-type: application/json
  writer-with-order-by-keys: true

time:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}
  rate-limit:
    requests-per-minute: ${RATE_LIMIT_PER_MINUTE:600}
  push:
    reminders: ${PUSH_REMINDERS:true}
    expo-access-token: ${EXPO_ACCESS_TOKEN:}
    web-push-public-key: ${WEB_PUSH_PUBLIC_KEY:}
    web-push-private-key: ${WEB_PUSH_PRIVATE_KEY:}
    web-push-subject: ${WEB_PUSH_SUBJECT:}


---
spring:
  config:
    activate:
      on-profile: prod
logging:
  structured:
    format:
      console: ecs
