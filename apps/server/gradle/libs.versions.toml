[versions]
kotlin = "2.3.21"
spring-boot = "4.1.2"
spring-dependency-management = "1.1.7"
springdoc = "3.2.0"
spotless = "8.11.0"
ktlint = "1.8.0"
webpush = "1.3.0"
store-adapter-jvm = "0.2.0"

[libraries]
springdoc-webmvc = { module = "org.springdoc:springdoc-openapi-starter-webmvc-api", version.ref = "springdoc" }
webpush = { module = "com.interaso:webpush", version.ref = "webpush" }
store-adapter-jvm = { module = "org.skkil.store:store-adapter-jvm", version.ref = "store-adapter-jvm" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
kotlin-spring = { id = "org.jetbrains.kotlin.plugin.spring", version.ref = "kotlin" }
spring-boot = { id = "org.springframework.boot", version.ref = "spring-boot" }
spring-dependency-management = { id = "io.spring.dependency-management", version.ref = "spring-dependency-management" }
spotless = { id = "com.diffplug.spotless", version.ref = "spotless" }
