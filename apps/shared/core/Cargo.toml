[package]
name = "time-core"
version = "0.1.0"
description = "skkil time's platform-free domain: types, rules, storage and mutations"
authors = ["hyoungjoojin"]
edition = "2024"

[lib]
name = "time_core"

[features]
default = ["native"]
native = ["rusqlite/bundled", "skkil-store-core/bundled"]
specta = ["dep:specta", "dep:specta-typescript"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
rusqlite = { version = "0.41", features = ["chrono"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
skkil-store-core = { path = "../../../../store/modules/core/crates/store-core", default-features = false }
specta = { version = "=2.0.0-rc.26", features = ["derive"], optional = true }
specta-typescript = { version = "=0.0.13", optional = true }
thiserror = "2"
uuid = { version = "1", features = ["v5", "v7"] }

[target.'cfg(all(target_family = "wasm", target_os = "unknown"))'.dependencies]
chrono = { version = "0.4", features = ["serde", "wasmbind"] }
uuid = { version = "1", features = ["v5", "v7", "js"] }
