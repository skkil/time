[package]
name = "skkil-time"
version = "0.1.0"
description = "Week tracker"
authors = ["hyoungjoojin"]
edition = "2024"

[lib]
name = "skkil_time_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["bundled", "chrono"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
ureq = { version = "3.5.0", features = ["json"] }

[profile.release]
incremental = true
opt-level = 3
panic = "abort"
strip = true
