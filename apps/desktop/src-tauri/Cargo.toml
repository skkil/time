[package]
name = "skkil-time"
version = "0.1.0"
description = "Week tracker"
authors = ["hyoungjoojin"]
edition = "2024"

[lib]
name = "skkil_time_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
time-core = { path = "../../core", features = ["specta"] }
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.41", features = ["backup", "bundled"] }
chrono = { version = "0.4", features = ["serde"] }
thiserror = "2"
specta = { version = "=2.0.0-rc.26", features = ["derive"] }
specta-typescript = "=0.0.13"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
ureq = { version = "3.5.0", features = ["json"] }
tauri-plugin-dialog = "2.8.4"
notify-rust = "4.18.2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-single-instance = "2"
rmcp = { version = "3.9.0", features = ["server", "transport-io", "macros"] }
schemars = "1"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "io-std"] }
dirs = "6"

[profile.release]
incremental = true
opt-level = 3
panic = "abort"
strip = true
