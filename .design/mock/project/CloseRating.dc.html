<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Close the day: felt rating</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700&amp;family=Red+Hat+Mono:wght@500&amp;family=Red+Hat+Text:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
body{margin:0}
.app *{box-sizing:border-box}
.app{font-family:"Red Hat Text","Pretendard Variable",Pretendard,system-ui,sans-serif;font-size:14px;line-height:1.45;color:#1A1D21;background:#F2F3F0;font-variant-numeric:tabular-nums;min-height:900px;display:flex;flex-direction:column}
.app h1{font-family:"Red Hat Display","Pretendard Variable",Pretendard,system-ui,sans-serif;font-weight:700;margin:0;letter-spacing:-.015em;font-size:40px;line-height:1.1}
.app p{margin:0}
.m{color:#5B6169}.s{font-size:12px}.b{font-weight:600}
.row{display:flex;align-items:center;gap:8px}
.top{display:flex;justify-content:space-between;align-items:center;padding:16px 28px;border-bottom:1px solid #D3D6D0;flex-wrap:wrap;gap:12px}
.btn{font:inherit;font-weight:600;font-size:13px;height:32px;padding:0 12px;border-radius:4px;border:1px solid #D3D6D0;background:#fff;color:#1A1D21;display:inline-flex;align-items:center;gap:6px;cursor:pointer;text-decoration:none}
.btn.q{background:transparent;border-color:transparent;color:#0B5CAD;text-decoration:underline;text-underline-offset:3px}
.btn:focus-visible,.app a:focus-visible{outline:2px solid #0B5CAD;outline-offset:2px}
.kbd{font-family:"Red Hat Mono",monospace;font-size:11px;padding:0 5px;line-height:18px;border:1px solid #D3D6D0;border-radius:4px;color:#5B6169;background:#fff}
.steps{display:flex;gap:6px;align-items:center;font-size:12px;color:#5B6169}
.steps i{display:block;width:24px;height:4px;border-radius:2px;background:#D3D6D0}
.steps i.on{background:#1A1D21}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:48px 16px}
.inner{width:100%;max-width:680px;display:flex;flex-direction:column;gap:32px}
.scale{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:10px}
.r{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;height:112px;border:1px solid #D3D6D0;border-radius:10px;background:#fff;cursor:pointer;font:inherit;color:#1A1D21;text-decoration:none}
.r:hover{border-color:#1A1D21}
.r:focus-visible{outline:2px solid #0B5CAD;outline-offset:2px}
.r .n{font-family:"Red Hat Display",sans-serif;font-weight:500;font-size:40px;line-height:1}
.r .w{font-size:13px;font-weight:600;color:#5B6169}
.r.hover{border-color:#1A1D21;box-shadow:inset 0 0 0 1px #1A1D21}
</style>
</helmet>
<div class="app">
  <header class="top">
    <div class="row" style="gap:16px">
      <span class="b">Close the day</span>
      <span class="m">Thursday 22 October</span>
    </div>
    <div class="row" style="gap:16px">
      <div class="steps" aria-label="Step 1 of 2"><i class="on"></i><i></i><span>1 of 2</span></div>
      <a class="btn" href="Main.dc.html">Later<span class="kbd">Esc</span></a>
    </div>
  </header>

  <div class="stage">
    <div class="inner">
      <div style="display:flex;flex-direction:column;gap:12px">
        <h1 id="felt">How did today feel?</h1>
        <p class="m" style="font-size:16px;max-width:52ch">Answer before you see any numbers. That way the comparison stays honest.</p>
      </div>
      <div class="scale" role="radiogroup" aria-labelledby="felt">
        <a class="r" role="radio" aria-checked="false" href="CloseDay.dc.html"><span class="n">1</span><span class="w">Rough</span></a>
        <a class="r" role="radio" aria-checked="false" href="CloseDay.dc.html"><span class="n">2</span><span class="w">Meh</span></a>
        <a class="r" role="radio" aria-checked="false" href="CloseDay.dc.html"><span class="n">3</span><span class="w">Okay</span></a>
        <a class="r hover" role="radio" aria-checked="false" href="CloseDay.dc.html"><span class="n">4</span><span class="w">Good</span></a>
        <a class="r" role="radio" aria-checked="false" href="CloseDay.dc.html"><span class="n">5</span><span class="w">Great</span></a>
      </div>
      <div class="row" style="justify-content:space-between;flex-wrap:wrap">
        <span class="s m">One tap or keys 1–5. Takes you straight to the day.</span>
        <a class="btn q" href="CloseDay.dc.html">Skip rating</a>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
