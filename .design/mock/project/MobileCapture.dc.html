<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Mobile capture</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Red+Hat+Display:wght@500;700&amp;family=Red+Hat+Mono:wght@500&amp;family=Red+Hat+Text:wght@400;500;600&amp;display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/pretendard@1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css" rel="stylesheet">
<style>
body{margin:0}
.ph *{box-sizing:border-box}
.ph{width:390px;height:844px;font-family:"Red Hat Text","Pretendard Variable",Pretendard,system-ui,sans-serif;font-size:15px;line-height:1.45;color:#1A1D21;background:#5B6169;font-variant-numeric:tabular-nums;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden;position:relative}
.ph h2{font-family:"Red Hat Display","Pretendard Variable",Pretendard,system-ui,sans-serif;font-weight:700;margin:0;font-size:19px;letter-spacing:-.01em}
.ph p{margin:0}
.m{color:#5B6169}.s{font-size:13px}.b{font-weight:600}
.row{display:flex;align-items:center;gap:8px}
.col{display:flex;flex-direction:column}
.behind{position:absolute;inset:0;background:#F2F3F0;opacity:.35}
.sheet{position:relative;background:#fff;border-radius:16px 16px 0 0;padding:10px 16px 34px;display:flex;flex-direction:column;gap:16px}
.grab{width:36px;height:5px;border-radius:3px;background:#D3D6D0;align-self:center}
.cap{display:flex;align-items:center;border:1px solid #1A1D21;border-radius:10px;padding:0 12px;height:52px}
.cap input{flex:1;border:0;font:inherit;font-size:17px;min-width:0;background:transparent;color:#1A1D21}
.cap:focus-within{box-shadow:0 0 0 2px #0B5CAD}
.cap input:focus-visible{outline:none}
.chip{display:inline-flex;align-items:center;height:26px;padding:0 9px;border-radius:4px;font-size:13px;font-weight:600;background:#E4E6E1;color:#1A1D21}
.chip.o{background:#EAF1F9;color:#0B5CAD}
.chip.a{background:#FBF3E6;color:#8A5000}
.mono{font-family:"Red Hat Mono",monospace;font-weight:500;font-size:13px}
.opt{display:flex;gap:12px;align-items:center;padding:12px 14px;border:1px solid #D3D6D0;border-radius:10px;min-height:56px;background:#fff;font:inherit;color:inherit;text-align:left;width:100%}
.opt[aria-checked="true"]{border-color:#1A1D21;box-shadow:inset 0 0 0 1px #1A1D21}
.radio{width:20px;height:20px;border-radius:50%;border:1.5px solid #5B6169;flex:none}
.opt[aria-checked="true"] .radio{border:6px solid #1A1D21}
.btn{font:inherit;font-weight:600;font-size:16px;height:50px;border-radius:10px;border:1px solid #1A1D21;background:#1A1D21;color:#fff;width:100%;cursor:pointer}
.btn:focus-visible,.opt:focus-visible{outline:2px solid #0B5CAD;outline-offset:2px}
</style>
</helmet>
<div class="ph">
  <div class="behind" aria-hidden="true"></div>
  <section class="sheet" role="dialog" aria-labelledby="add-t">
    <span class="grab" aria-hidden="true"></span>
    <h2 id="add-t">Add a task</h2>
    <label class="cap"><input value="Book 2 more interviews ~15m #interviews" aria-label="Task"></label>
    <div class="row" style="flex-wrap:wrap;gap:6px">
      <span class="chip">15 min</span><span class="chip o">5 user interviews booked</span><span class="chip">You do it</span>
    </div>
    <p class="s m"><span class="mono">~15m</span> estimate, <span class="mono">@agent</span> delegate, <span class="mono">#</span> outcome</p>

    <div class="col" style="gap:8px" role="radiogroup" aria-labelledby="when">
      <span id="when" class="b">When?</span>
      <button class="opt" role="radio" aria-checked="true"><span class="radio" aria-hidden="true"></span><span class="col"><span class="b">Backlog</span><span class="s m">Plan it on your desktop later</span></span></button>
      <button class="opt" role="radio" aria-checked="false"><span class="radio" aria-hidden="true"></span><span class="col"><span class="b">Shallow 16:00–16:30</span><span class="s m">15 min free in this block</span></span></button>
      <button class="opt" role="radio" aria-checked="false"><span class="radio" aria-hidden="true"></span><span class="col"><span class="b">On a trigger</span><span class="s m">"After the call with Hana"</span></span></button>
    </div>

    <button class="btn">Add to backlog</button>
  </section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
